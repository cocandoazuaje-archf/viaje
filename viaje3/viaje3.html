    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            gap: 40px;
        }

        .bag-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .bag-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }

        .bag-length {
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
        }

        .bag-container {
            display: flex;
            align-items: center;
        }

        /* Estructura del Cuerpo Principal */
        .bag-body {
            border: 2px solid #333;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
        }

        .bag-body span {
            color: #777;
            font-size: 14px;
        }

        /* Altura del cuerpo principal */
        .falabella .bag-body {
            width: 320px;
            height: 180px;
        }

        .mercadolibre .bag-body {
            width: 300px;
            height: 160px;
        }

        /* Etiqueta de Alto a la derecha del cuerpo */
        .bag-height {
            margin-left: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #333;
            white-space: nowrap;
        }

        /* Estructura del Ancho (Profundidad) lateral acoplada */
        .bag-depth-box {
            border: 2px solid #333;
            border-left: none; /* Se une visualmente al cuerpo principal */
            background-color: #e9ecef;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 10px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            color: #333;
        }

        .falabella .bag-depth-box {
            height: 100px; /* Ocupa la parte inferior derecha como en el diagrama */
            margin-top: 80px; /* Alineado abajo a la derecha */
        }

        .mercadolibre .bag-depth-box {
            height: 90px;
            margin-top: 70px;
        }
    </style>
